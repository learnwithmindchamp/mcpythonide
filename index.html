<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Practice Pro</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        :root { --py-blue: #3776ab; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: #ddd; padding: 20px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
        h2 { color: #ffd43b; font-size: 1rem; margin-top: 0; }
        textarea { width: 100%; height: 100px; background: #000; color: #9cdcfe; border: 1px solid #444; padding: 10px; box-sizing: border-box; font-family: inherit; margin: 10px 0; border-radius: 4px; }
        button { background: var(--py-blue); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .console { background: #000; color: #fff; padding: 12px; margin-top: 15px; border-radius: 4px; font-size: 0.9rem; white-space: pre-wrap; min-height: 20px; border: 1px dotted #444; }
        #status { color: #ffd43b; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="container">
    <div id="status">⏳ Loading Python Environment...</div>
    <div id="app"></div>
</div>

<script>
    const questions = [
        { id: 1, q: "1. Print 'Hello Python'", default: "print('Hello Python')" },
        { id: 2, q: "2. Input Name & Greet", default: "name = input('Enter name: ')\nprint(f'Hello {name}, welcome to Python!')" },
        { id: 3, q: "3. Sum of Two Numbers", default: "num1 = int(input('First number: '))\nnum2 = int(input('Second number: '))\nprint(f'The sum is: {num1 + num2}')" }
    ];

    let pyodide;

    async function init() {
        try {
            pyodide = await loadPyodide();
            document.getElementById('status').innerText = "✅ Python Engine Ready!";
            render();
        } catch (e) {
            document.getElementById('status').innerText = "❌ Failed to load Python.";
        }
    }

    function render() {
        const app = document.getElementById('app');
        questions.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h2>${item.q}</h2>
                <textarea id="code-${item.id}" spellcheck="false">${item.default}</textarea>
                <button onclick="runCode(${item.id})">Run Code</button>
                <div id="out-${item.id}" class="console">Output will appear here...</div>
            `;
            app.appendChild(div);
        });
    }

    async function runCode(id) {
        const code = document.getElementById(`code-${id}`).value;
        const out = document.getElementById(`out-${id}`);
        out.innerText = "Running...";
        out.classList.remove('error');

        // This is the magic: redefining input() to work without SharedArrayBuffers
        const setupCode = `
import sys
import io

# Mock input to use JS prompt
def input(prompt_msg=""):
    from js import window
    return window.prompt(prompt_msg)

sys.stdout = io.StringIO()
`;

        try {
            await pyodide.runPythonAsync(setupCode);
            await pyodide.runPythonAsync(code);
            const stdout = pyodide.runPython("sys.stdout.getvalue()");
            out.innerText = stdout || "Done (No output to print)";
        } catch (err) {
            out.classList.add('error');
            out.innerText = "Python Error:\n" + err.message;
        }
    }

    init();
</script>
</body>
</html>
