<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindChamp's Python Lab</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://skulpt.org/js/skulpt.min.js"></script>
    <script src="https://skulpt.org/js/skulpt-stdlib.js"></script>

    <style>
        :root { --accent: #3776ab; --yellow: #ffd43b; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #2d2d2d; color: white; font-family: sans-serif; overflow: hidden; }
        header { height: 50px; background: #333; display: flex; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--accent); justify-content: space-between; }
        .container { display: flex; height: calc(100vh - 50px); width: 100%; }
        .editor-side { width: 50%; display: flex; flex-direction: column; border-right: 2px solid #111; }
        textarea { flex: 1; background: #1e1e1e; color: #9cdcfe; border: none; padding: 20px; font-family: 'Consolas', monospace; font-size: 16px; outline: none; resize: none; }
        .output-side { width: 50%; background: #000; display: flex; flex-direction: column; position: relative; overflow-y: auto; }
        #console { padding: 20px; font-family: monospace; color: #fff; white-space: pre-wrap; font-size: 14px; }
        /* Drawing Area */
        #turtle-canvas { background: white; width: 100%; display: none; min-height: 450px; }
        .btn-run { background: #2ecc71; color: white; border: none; padding: 8px 25px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; color:var(--yellow)">MindChamp's Python Lab</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <span id="status" style="font-size: 12px; color: #ffd43b;">● Initializing...</span>
        <label><input type="checkbox" id="mode-toggle"> Turtle Mode</label>
        <button class="btn-run" id="run-btn" onclick="runPython()">RUN CODE</button>
    </div>
</header>

<div class="container">
    <div class="editor-side">
<textarea id="editor" spellcheck="false">import turtle

t = turtle.Turtle()
t.shape("turtle")
t.color("blue")

for i in range(4):
    t.forward(100)
    t.left(90)

print("Logic & Drawing Complete!")</textarea>
    </div>

    <div class="output-side">
        <div id="turtle-canvas"></div>
        <div id="console"></div>
    </div>
</div>

<script type="text/javascript">
// Wait for library to be ready
function checkLibs() {
    if (typeof Sk !== "undefined") {
        document.getElementById("status").innerHTML = "● Engine Ready";
        document.getElementById("status").style.color = "#2ecc71";
    } else {
        setTimeout(checkLibs, 100);
    }
}
checkLibs();

function outf(text) {
    var mypre = document.getElementById("console");
    mypre.innerHTML = mypre.innerHTML + text;
}

function builtinRead(x) {
    if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
        throw "File not found: '" + x + "'";
    return Sk.builtinFiles["files"][x];
}

function runPython() {
    var code = document.getElementById("editor").value;
    var consoleArea = document.getElementById("console");
    var turtleArea = document.getElementById("turtle-canvas");
    var isTurtle = document.getElementById("mode-toggle").checked;

    consoleArea.innerHTML = 'Starting... \n';
    
    if(isTurtle) {
        turtleArea.style.display = "block";
        turtleArea.innerHTML = ""; 
    } else {
        turtleArea.style.display = "none";
    }

    Sk.pre = "console";
    Sk.configure({
        output: outf,
        read: builtinRead,
        __future__: Sk.python3
    });

    // Link Turtle to the specific Div
    (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'turtle-canvas';

    var myPromise = Sk.misieval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>", false, code, true);
    });

    myPromise.then(function(mod) {
        console.log('Success');
    }, function(err) {
        outf("\nError: " + err.toString());
    });
}
</script>

</body>
</html>
