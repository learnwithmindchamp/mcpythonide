<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindChamp's Python Lab</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        :root { --accent: #3776ab; --yellow: #ffd43b; --editor-bg: #1e1e1e; --console-bg: #000; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #2d2d2d; color: white; font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        header { 
            height: 50px; background: #333; display: flex; align-items: center; 
            padding: 0 20px; border-bottom: 2px solid var(--accent);
            justify-content: space-between;
        }

        .brand { font-weight: bold; font-size: 1.2rem; color: var(--yellow); }
        #status { font-size: 0.8rem; color: #aaa; }

        .container { 
            display: flex; height: calc(100vh - 50px); width: 100%; 
        }

        /* LEFT SIDE: EDITOR */
        .editor-container { 
            width: 50%; display: flex; flex-direction: column; 
            border-right: 2px solid #444; 
        }
        
        .toolbar { 
            background: #3c3c3c; padding: 8px 15px; display: flex; gap: 10px; 
        }

        textarea { 
            flex: 1; background: var(--editor-bg); color: #9cdcfe; 
            border: none; padding: 20px; font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 16px; outline: none; resize: none; line-height: 1.5;
        }

        /* RIGHT SIDE: CONSOLE */
        .console-container { 
            width: 50%; background: var(--console-bg); display: flex; flex-direction: column; 
        }

        .console-header { 
            background: #3c3c3c; padding: 8px 15px; font-size: 0.8rem; 
            color: #888; text-transform: uppercase; letter-spacing: 1px;
        }

        #output { 
            flex: 1; padding: 20px; font-family: 'Consolas', monospace; 
            font-size: 15px; color: #fff; overflow-y: auto; white-space: pre-wrap;
        }

        /* BUTTONS */
        .btn-run { 
            background: #2ecc71; color: white; border: none; padding: 5px 20px; 
            border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-run:hover { background: #27ae60; }
        .btn-run:disabled { background: #555; cursor: wait; }
        
        .btn-clear { 
            background: transparent; color: #aaa; border: 1px solid #555; 
            padding: 5px 15px; border-radius: 4px; cursor: pointer;
        }
        .btn-clear:hover { border-color: #888; color: white; }

        .error-text { color: #ff6b6b; }
    </style>
</head>
<body>

<header>
    <div class="brand">MindChamp's Python Lab</div>
    <div id="status">⚡ Loading Engine...</div>
</header>

<div class="container">
    <div class="editor-container">
        <div class="toolbar">
            <button id="run-btn" class="btn-run" onclick="runPython()" disabled>Run (Ctrl+Enter)</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="Write your code here..."># Section A - Question 1
print("Hello Python")
</textarea>
    </div>

    <div class="console-container">
        <div class="console-header">Console Output</div>
        <div id="output">Output will appear here...</div>
    </div>
</div>

<script>
    let pyodide;

    async function init() {
        try {
            pyodide = await loadPyodide();
            document.getElementById('status').innerText = "✅ Ready";
            document.getElementById('run-btn').disabled = false;
        } catch (e) {
            document.getElementById('status').innerText = "❌ Load Error";
        }
    }

    async function runPython() {
        const code = document.getElementById('editor').value;
        const out = document.getElementById('output');
        out.innerText = "Running...\n";

        // Setup the print redirection and prompt-based input
        const setup = `
import sys, io
from js import window
def input(p=""): return window.prompt(p)
sys.stdout = io.StringIO()
`;

        try {
            await pyodide.runPythonAsync(setup);
            await pyodide.runPythonAsync(code);
            const result = pyodide.runPython("sys.stdout.getvalue()");
            out.innerText = result || "Program finished (no output).";
        } catch (err) {
            out.innerHTML = `<span class="error-text">Python Error:\n${err.message}</span>`;
        }
    }

    function clearAll() {
        document.getElementById('output').innerText = "";
        document.getElementById('editor').value = "";
        document.getElementById('editor').focus();
    }

    // Keyboard Shortcut: Ctrl + Enter
    document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') {
            if (!document.getElementById('run-btn').disabled) runPython();
        }
    });

    init();
</script>
</body>
</html>
